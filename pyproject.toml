[project]
name = "latham"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hector Brown", email = "hectorjbrown@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "jupyterlab-vim>=4.1.4",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numba-progress>=1.2.0",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
]

[project.scripts]
latham = "latham:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
